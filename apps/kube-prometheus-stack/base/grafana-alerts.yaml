apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alerting
  namespace: monitoring
  labels:
    grafana_alert: "1"
data:
  grafana-alert.yaml: |
    apiVersion: 1
    alerting:
      - name: Example Alert
        expr: avg(rate(http_requests_total{status="500"}[5m])) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Just an example, expecting fail"
