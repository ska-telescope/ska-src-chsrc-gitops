---
grafana:
  ingress:
    hosts:
      - grafana.src.skach.org
    tls:
      - secretName: grafana.src.skach.org
        hosts:
          - grafana.src.skach.org
  grafana.ini:
    server:
      root_url: https://grafana.src.skach.org
alertmanager:
  config:
    global:
      # The secret value will be mounted in /etc/alertmanager/secrets/secret-name/key
      slack_api_url_file: '/etc/alertmanager/secrets/slack-api-url/slack-api-url'
    route:
      - receiver: 'slack-prod'
        matchers:
          - alertname = "ProbeFailure"
          - environment = "prod"
    receivers:
      - name: 'slack-prod'
        slack_configs:
        - channel: '#chsrc-alerts-dev'
          send_resolved: true
          title: >
            {{ if eq .Status "resolved" }}
            :white_check_mark: Service {{ .CommonLabels.servicename }} in {{ .CommonLabels.location }} {{ .CommonLabels.environment }} has recovered
            {{ else }}
            :alert: Service {{ .CommonLabels.servicename }} in {{ .CommonLabels.location }} {{ .CommonLabels.environment }} is down
            {{ end }}
          title_link: 'https://grafana.src.skach.org/d/site_specific_services/central-monitoring-srcnet-site-services?orgId=1'
          text: |
            {{ if eq .Status "resolved" }}
            *Site timeline*: https://grafana.src.skach.org/d/site_specific_services/central-monitoring-srcnet-site-services?orgId=1&var-sitename={{ .CommonLabels.location }}&var-environment={{ .CommonLabels.environment }}&viewPanel=2
            *Site overview*: https://grafana.src.skach.org/d/site_specific_services/central-monitoring-srcnet-site-services?orgId=1&var-sitename={{ .CommonLabels.location }}&var-environment={{ .CommonLabels.environment }}

            The service has recovered and is back online.
            *Instance*: {{ .CommonLabels.instance }} {{ .CommonLabels.environment }}
            {{ else }}
            *Site timeline*: https://grafana.src.skach.org/d/site_specific_services/central-monitoring-srcnet-site-services?orgId=1&var-sitename={{ .CommonLabels.location }}&var-environment={{ .CommonLabels.environment }}&viewPanel=2
            *Site overview*: https://grafana.src.skach.org/d/site_specific_services/central-monitoring-srcnet-site-services?orgId=1&var-sitename={{ .CommonLabels.location }}&var-environment={{ .CommonLabels.environment }}
            *Instance*: {{ .CommonLabels.instance }} {{ .CommonLabels.environment }}
            {{ end }}