---
grafana:
  ingress:
    hosts:
      - grafana.src.skach.org
    tls:
      - secretName: grafana.src.skach.org
        hosts:
          - grafana.src.skach.org
  grafana.ini:
    server:
      root_url: https://grafana.src.skach.org
alertmanager:
  config:
    route:
      group_by: ['alertname', 'location', 'instance', 'environment']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      #receiver: 'slack'
      routes:
      - receiver: 'null'
        matchers:
          - alertname = "Watchdog"
      - receiver: 'slack-prod'
        matchers:
          - alertname = "ProbeFailure"
          - environment = "prod"
    receivers:
    - name: 'null'
    - name: 'slack-prod'
      slack_configs:
      # TODO: Change when there is a prod channel
      - channel: '#chsrc-alerts-dev'
        send_resolved: true
        title: >
          {{ if eq .Status "resolved" }}
          :white_check_mark: Service {{ .CommonLabels.servicename }} in {{ .CommonLabels.location }} {{ .CommonLabels.environment }} has recovered
          {{ else }}
          :alert: Service {{ .CommonLabels.servicename }} in {{ .CommonLabels.location }} {{ .CommonLabels.environment }} is down
          {{ end }}
        title_link: 'https://grafana.src.skach.org/d/site_specific_services/central-monitoring-srcnet-site-services?orgId=1'
        text: |
          {{ if eq .Status "resolved" }}
          *Site timeline*: <https://grafana.src.skach.org/d/site_specific_services/central-monitoring-srcnet-site-services?orgId=1&var-sitename={{ .CommonLabels.location }}&var-environment={{ .CommonLabels.environment }}&viewPanel=2|Link to Grafana>
          *Site overview*: <https://grafana.src.skach.org/d/site_specific_services/central-monitoring-srcnet-site-services?orgId=1&var-sitename={{ .CommonLabels.location }}&var-environment={{ .CommonLabels.environment }}|Link to Grafana>

          The service has recovered and is back online.
          *Instance*: {{ .CommonLabels.instance }} {{ .CommonLabels.environment }}
          {{ else }}
          *Site timeline*: <https://grafana.src.skach.org/d/site_specific_services/central-monitoring-srcnet-site-services?orgId=1&var-sitename={{ .CommonLabels.location }}&var-environment={{ .CommonLabels.environment }}&viewPanel=2|Link to Grafana>
          *Site overview*: <https://grafana.src.skach.org/d/site_specific_services/central-monitoring-srcnet-site-services?orgId=1&var-sitename={{ .CommonLabels.location }}&var-environment={{ .CommonLabels.environment }}|Link to Grafana>
          *Instance*: {{ .CommonLabels.instance }} {{ .CommonLabels.environment }}
          {{ end }}
    templates:
    - '/etc/alertmanager/config/*.tmpl'
