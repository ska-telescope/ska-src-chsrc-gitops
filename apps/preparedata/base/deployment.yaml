apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: preparedata-app
  name: preparedata-app
  namespace: preparedata
spec:
  replicas: 2
  selector:
    matchLabels:
      app: preparedata-app
  template:
    metadata:
      labels:
        app: preparedata-app
    spec:
      containers:
        - image: registry.gitlab.com/ska-telescope/src/src-dm/ska-src-dm-local-data-preparer/preparedata:python-part-initial
          imagePullPolicy: Always
          name: preparedata
          ports:
            - containerPort: 8000
              name: fastapi
              protocol: TCP
          env:
            - name: PREPARE_DATA_APPROACH
              value: "copy_to_user_area"
            - name: ABS_PATH_USER_AREA_ROOT
              value: "/mnt/cavern/home"
          volumeMounts:
            - name: userspace-volume
              mountPath: /mnt
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: userspace-volume
          persistentVolumeClaim:
            claimName: userspace-pvc
