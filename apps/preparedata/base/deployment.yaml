apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: preparedata-app
  name: preparedata-app
  namespace: preparedata
spec:
  replicas: 2
  selector:
    matchLabels:
      app: preparedata-app
  template:
    metadata:
      labels:
        app: preparedata-app
    spec:
      containers:
        - image: registry.gitlab.com/ska-telescope/src/src-dm/ska-src-dm-local-data-preparer/preparedata:python-part-initial
          imagePullPolicy: Always
          name: preparedata
          ports:
            - containerPort: 8000
              name: fastapi
              protocol: TCP
          env:
            - name: PREPARE_DATA_APPROACH
              value: "copy_to_user_area"
            - name: ABS_PATH_USER_AREA_ROOT
              value: "/users/cavern/home"
            - name: RSE_ROOT
              value: /rse
          volumeMounts:
            - name: userspace-volume
              mountPath: /users
            - name: rse-volume
              mountPath: /rse
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            limits:
              cpu: "1000m"
              memory: "1024Mi"
            requests:
              cpu: "500m"
              memory: "512Mi"
        - name: ska-src-local-data-preparer
          image: registry.gitlab.com/ska-telescope/src/src-dm/ska-src-dm-local-data-preparer/ska-src-local-data-preparer-celery-worker:async-job-submission-2
          imagePullPolicy: IfNotPresent
          env:
            - name: BROKER_TRANSPORT
              value: "sqlalchemy"
            - name: CELERY_BROKER_URL
              value: "sqlite:////var/lib/sqlite/celery_broker.db" # TODO: This no longer works. What's the way to integrate sqlite?
            - name: ABS_PATH_CELERY_RESULTS
              value: /var/celery/results
          command:
            - "celery"
            - "-A"
            - "prepare_data.worker"
            - "worker"
            - "--loglevel=info"
          volumeMounts:
            - name: sqlite-storage
              mountPath: /var/lib/sqlite
          resources:
            limits:
              cpu: "1000m"
              memory: "1024Mi"
            requests:
              cpu: "500m"
              memory: "512Mi"
        - name: sqlite
          image: alpine/sqlite
          command: ["sqlite3", "/var/lib/sqlite/celery_broker.db"]
          volumeMounts:
            - name: sqlite-storage
              mountPath: /var/lib/sqlite
      volumes:
        - name: userspace-volume
          persistentVolumeClaim:
            claimName: userspace-pvc
        - name: rse-volume
          persistentVolumeClaim:
            claimName: preparedata-rse-pvc
        - name: sqlite-storage
          persistentVolumeClaim:
            claimName: sqlite-pvc
