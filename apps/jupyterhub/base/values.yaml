hub:
  extraEnv:
    OAUTH_CLIENT_SECRET:
      valueFrom:
        secretKeyRef:
          name: jupyterhub
          key: CLIENT_SECRET
  config:
    Authenticator:
      enable_auth_state: true
      allow_all: true
    GenericOAuthenticator:
      login_service: "SKA-IAM"
      authorize_url: https://ska-iam.stfc.ac.uk/authorize
      token_url: https://ska-iam.stfc.ac.uk/token
      userdata_url: https://ska-iam.stfc.ac.uk/userinfo
      scope:
        - openid
        - profile
        - email
        - offline_access
      userdata_token_method: GET
      userdata_params: { "state": "state" }
      username_key: preferred_username
      allowed_groups:
        - "src/chsrc"
    JupyterHub:
      authenticator_class: generic-oauth
    BinderSpawner:
      auth_enabled: true
  db:
    pvc:
      storageClassName: ceph-corbo-rbd-hdd

ingress:
  enabled: true
  ingressClassName: "nginx"
  annotations:
    kubernetes.io/ingress.class: "nginx"
  pathSuffix: ""
  pathType: Prefix

proxy:
  service:
    type: ClusterIP

singleuser:
  image:
    name: quay.io/jupyter/minimal-notebook
    tag: notebook-7.2.2
  memory:
    limit:
    guarantee: 1G
  cpu:
    limit:
    guarantee:
  profileList:
    - display_name: "Minimal environment"
      description: "Python environment."
      default: true
  storage:
    capacity: 10Gi
    dynamic:
      storageClass: ceph-corbo-rbd-hdd
    extraVolumes:
      - name: rse-volume
        persistentVolumeClaim:
          claimName: jupyterhub-rse-pvc
    extraVolumeMounts:
      - name: rse-volume
        mountPath: /home/jovyan/rse
        subPath: deterministic
        readOnly: true
    # extraVolumes:
    #   - name: <name>
    # extraVolumeMounts: # do we need to mount additional volumes, e.g. to read&write "large" data products?
    #   - name: <name>
    #   - mountPath: <path>
  cmd: null # allows custom cmd for jupyter docker-stacks to be used for startup customization
  # memory:
  #   guarantee: 1G  # current default [3.3.8 - 07-24]
  # networkPolicy:
  #   allowedIngressPorts: [ssh]  # allow ssh &| sftp?
  cloudMetadata:
    blockWithIptables: false
