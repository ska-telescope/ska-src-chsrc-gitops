---
gatekeeper:
  services:
    - route: "/soda"                            # request route
      namespace: soda                           # namespace the service will run in, can be different to gatekeeper ns
      prefix: "http://"                         # usually http:// assuming SSL termination occurs upstream
      service_name: "ska-src-soda"                      # to proxied address
      ingress_host: "gatekeeper.dev.skach.org"  # Host domain the Ingress rules will apply to
      port: 8080
      uuid: "df296b0f-4677-449a-bb2b-666527f3f3d1"  # generated by the site capabilities catalogue, corresponding entry must exist in iam
    - route: "/echo"                            # request route
      namespace: ska-src-gatekeeper-echo                   # namespace the service will run in, can be different to gatekeeper ns
      prefix: "http://"                         # usually http:// assuming SSL termination occurs upstream
      service_name: "ska-src-gatekeeper-echo"                      # to proxied address
      ingress_host: "gatekeeper.dev.skach.org"  # Host domain the Ingress rules will apply to
      port: 8080
      uuid: "a2cba753-4589-4395-887c-937768fdcc75"  # generated by the site capabilities catalogue, corresponding entry must exist in iam

ingress-nginx:
  controller:
    extraArgs:
      default-ssl-certificate: "gatekeeper/gatekeeper.dev.skach.org"