apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base
- certificate.yaml

# Patching of regular resources
patches: []

# Helm chart definition with values overlay
helmCharts:
  - name: ska-src-dm-da-service-gatekeeper
    repo: https://gitlab.com/api/v4/projects/60950975/packages/helm/stable
    version: 0.2.1
    namespace: gatekeeper
    # base values file
    valuesFile: ../../base/values.yaml
    # overlay values file that will override the base
    additionalValuesFiles:
      - values.yaml
    releaseName: gatekeeper
