# ServiceAccount is provided by skaha-base
#apiVersion: v1
#kind: ServiceAccount
#metadata:
#  name: skaha
#  namespace: skaha-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: skaha-vault-access
roleRef:
  kind: ClusterRole
  name: system:auth-delegator
  apiGroup: rbac.authorization.k8s.io
subjects:
  - kind: ServiceAccount
    name: skaha
    namespace: skaha-system
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: skaha
  namespace: skaha-system
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "app"
      version: "v2"
      auth:
        kubernetes:
          # Path where the Kubernetes authentication backend is mounted in Vault
          mountPath: "kubernetes"
          # A required field containing the Vault Role to assume.
          role: "skaha"
          # Optional service account field containing the name
          # of a kubernetes ServiceAccount
          serviceAccountRef:
            name: "skaha"
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: skaha
  namespace: skaha-system
spec:
  refreshInterval: "15s" # time to sync from vault
  secretStoreRef:
    name: skaha
    kind: SecretStore
  target:
    name: skaha-secrets
    creationPolicy: Owner # create secret if not exists
  data:
    - secretKey: postgres-password
      remoteRef:
        key: app/data/skaha # path to secret in vault
        property: postgres-password # key in the vault secret
    - secretKey: oidc-client-secret
      remoteRef:
        key: app/data/skaha # path to secret in vault
        property: oidc-client-secret # key in the vault secret
    - secretKey: oidc-client-secret-storageui
      remoteRef:
        key: app/data/skaha # path to secret in vault
        property: oidc-client-secret-storageui # key in the vault secret